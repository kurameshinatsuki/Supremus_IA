name: SUPREMUS CI - IA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-ci-leurre
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Build Docker image with token
      run: |
        docker build \
          --build-arg GITHUB_TOKEN=${{ secrets.GH_TOKEN }} \
          -t bot-leurre:latest .

    - name: Build sandbox image
      run: |
        mkdir -p /tmp/makima-sbx && chmod 777 /tmp/makima-sbx
        cd bacasable/image
        sh build.sh

    - name: Run bot container
      run: |
        timeout 14520s docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v /tmp/makima-sbx:/tmp/makima-sbx \
          -e SANDBOX_WORKDIR=/tmp/makima-sbx \
          -e GH_PR_TOKEN=${{ secrets.GH_PR_TOKEN }} \
          -e GH_PR_REPO=kurameshinatsuki/Supremus-IA \
          -e NODE_ENV=production \
          -e GH_RESTART_TOKEN=${{ secrets.GH_TOKEN }} \
          -e GITHUB_REPOSITORY=${{ github.repository }} \
          -e GH_WORKFLOW_FILE=deploy.yml \
          -e GH_WORKFLOW_REF=main \
          bot-leurre:latest